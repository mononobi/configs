# Memcached Configuration File
# Note: Core parameters (-m, -c, -p) are passed via docker-compose.yml.
# This configuration file is mounted at /etc/memcached/memcached.conf.

# Maximum Memory Allocation in Megabytes (default: 64MB)
-m 64

# Default Listening Port
-p 11211

# Maximum Simultaneous Connections
-c 1024

# Verbose logging to stderr/stdout
-v
