services:
  postgres:
    image: ${PG_IMAGE}
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${PG_PORT}:5432"
    environment:
      # Docker container server initialization variables (used by entrypoint on first cluster init)
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_DB}
      - PGDATA=/var/lib/postgresql/data/pgdata

      # Standard PostgreSQL client (libpq) defaults (used automatically by psql, pg_dump, etc. inside container)
      - PGUSER=${PG_USER}
      - PGDATABASE=${PG_DB}
      - PGPASSWORD=${PG_PASSWORD}
    command:
      - "postgres"
      - "-c"
      - "hba_file=/etc/postgresql/pg_hba.conf"
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./config/conf.d:/etc/postgresql/conf.d
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./initdb.d:/docker-entrypoint-initdb.d
      - ./logs:/var/log/postgresql
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
