services:
  plex:
    image: plexinc/pms-docker:latest
    container_name: plex-media-server
    restart: unless-stopped
    network_mode: host
    shm_size: 16g

    environment:
      - TZ=Europe/Berlin
      - PLEX_UID=${PLEX_UID}
      - PLEX_GID=${PLEX_GID}
      # Claim token (https://plex.tv/claim) automatically links this server to your plex.tv
      # account on initial startup. Only needed for first-time automated setup on a fresh
      # installation; NOT required when reusing existing metadata (saved in Preferences.xml).
      # - PLEX_CLAIM=claim-xxxx
      - ALLOWED_NETWORKS=127.0.0.1,192.168.0.0/16,10.0.0.0/8

    # This is the magic label that invites Watchtower in to update this container
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

    volumes:
      # 1. Host Metadata Store (preserves all settings, databases, and library info)
      - ${USER_HOME}/.plex/plexmediaserver:/config

      # 2. RAM Transcoder (1:1 mirror of host /dev/shm/plex)
      - /dev/shm/plex:/dev/shm/plex

      # 3. Host Temp & Downloads Directory (for offline sync & downloads)
      - ${USER_HOME}/.plex/tmp:${USER_HOME}/.plex/tmp

      # 4. Media Libraries (1:1 mirror of host filesystem paths)
      - /mnt/movies-1/Movies-1:/mnt/movies-1/Movies-1:ro
      - /mnt/movies-2/Movies-2:/mnt/movies-2/Movies-2:ro
      - /mnt/movies-3/Movies-3:/mnt/movies-3/Movies-3:ro
      - /mnt/movies-4/Movies-4:/mnt/movies-4/Movies-4:ro
      - /mnt/movies-5/Movies-5:/mnt/movies-5/Movies-5:ro
      - /mnt/movies-6/Movies-6:/mnt/movies-6/Movies-6:ro
      - /mnt/movies-7/Movies-7:/mnt/movies-7/Movies-7:ro
      - /mnt/movies-7/TV-Shows:/mnt/movies-7/TV-Shows:ro

    # Hardware Decoding & Transcoding: AMD Ryzen 7 7700 iGPU (RDNA 2 / VCN 3.0 via VA-API)
    devices:
      - /dev/dri:/dev/dri

    # Ensures container process has access to GPU device nodes on host (numeric GIDs)
    group_add:
      - "${VIDEO_GID}"
      - "${RENDER_GID}"
